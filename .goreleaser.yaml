# Release binaries for darwin/linux on tag push. The Homebrew formula is
# written from these archives by scripts/homebrew-formula.sh (make tap).
# (spec: Versioning). Run `make release-dry` to build every target locally.
version: 2

project_name: sous

builds:
  - main: ./cmd/sous
    binary: sous
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [arm64, amd64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/bilal-/sous/internal/cli.Version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, TRADEMARK.md, README.md, CHANGELOG.md]

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]

release:
  draft: false
  prerelease: auto
